<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processing Results</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <img src="/static/iit_roorkee_logo.png" alt="IIT Roorkee" />
    </div>
    <div class="title">
      <h1>Processing Complete</h1>
      <p>Civil Engineering Department, IIT Roorkee</p>
    </div>
  </header>

  <main class="content">
    <section class="result-card">
      <h2>Downloads</h2>
      <ul class="download-list">
        <li><a href="/{{ processed_video }}" class="btn-secondary">Processed Video</a></li>
        <li><a href="/{{ tracking_csv }}" class="btn-secondary">Tracking CSV</a></li>
        <li><a href="/{{ future_csv }}" class="btn-secondary">Prediction CSV</a></li>
        <li><a href="/{{ pet_csv }}" class="btn-secondary">PET Results</a></li>
      </ul>

      <h2>Heatmap Visualization</h2>
      <div class="heatmap-container">
        <img src="/{{ heatmap }}" alt="Heatmap" />
      </div>

      <a href="/" class="btn-link">&#8592; Back to Upload</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Civil Engineering Dept., IIT Roorkee</p>
  </footer>
</body>
</html>
